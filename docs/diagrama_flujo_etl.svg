<text x="650.0" y="1259" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1d2733" text-anchor="middle">stg.LogExtraccion: extraídos, rechazados, guardados, duración (ms), estado</text>

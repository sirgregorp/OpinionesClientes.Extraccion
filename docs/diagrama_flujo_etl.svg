<text x="650.0" y="371" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1d2733" text-anchor="middle">Task.WhenAll + SemaphoreSlim (máximo 4 a la vez) · Stopwatch por fuente</text>

<text x="650.0" y="1172" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1d2733" text-anchor="middle">SqlBulkCopy a stg.* en una transacción (o JSON temporal si Destino = Archivo)</text>

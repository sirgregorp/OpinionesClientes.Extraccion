<text x="650.0" y="197" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1d2733" text-anchor="middle">appsettings.json + User Secrets · inyección de dependencias · ILogger</text>
<polyline points="650.0,222 650.0,247" fill="none" stroke="#3d4852" stroke-width="1.8" marker-end="url(#ah)"/>

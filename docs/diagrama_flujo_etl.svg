<text x="650.0" y="284" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1d2733" text-anchor="middle">IdLote nuevo · ExtractorFactory crea un extractor por cada fuente habilitada</text>
<polyline points="650.0,309 650.0,334" fill="none" stroke="#3d4852" stroke-width="1.8" marker-end="url(#ah)"/>

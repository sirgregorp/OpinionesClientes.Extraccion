<rect width="1300" height="1570" fill="white"/>
<text x="650.0" y="40" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#1d2733" text-anchor="middle">Diagrama de flujo del proceso de extracción (E del ETL)</text>
<text x="650.0" y="64" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#5b6770" text-anchor="middle">Worker Service .NET 8 · Sistema de Análisis de Opiniones de Clientes</text>
